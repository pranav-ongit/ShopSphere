<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse all ShopSphere products: headphones, smartwatches, speakers and accessories.">
    <title>All products - ShopSphere</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="products.css">
</head>

<body class="shop-page">

    <!-- ===== Header ===== -->
    <header class="header" id="header">
        <div class="container header__inner">

            <a href="index.html" class="logo" aria-label="ShopSphere home">
                <svg class="logo__mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
                    <circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
                    <ellipse cx="14" cy="14" rx="5" ry="12" fill="none" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span class="logo__text">ShopSphere</span>
            </a>

            <nav class="nav" id="nav" aria-label="Main navigation">
                <ul class="nav__list">
                    <li><a href="index.html" class="nav__link">Home</a></li>
                    <li><a href="index.html#categories" class="nav__link">Categories</a></li>
                    <li><a href="products.html" class="nav__link is-active">Products</a></li>
                    <li><a href="index.html#offers" class="nav__link">Offers</a></li>
                    <li><a href="index.html#contact" class="nav__link">Contact</a></li>
                </ul>
            </nav>

            <div class="header__actions">
                <span id="accountSlot">
                    <a href="login.html" class="icon-btn" aria-label="Login or register">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                    </a>
                </span>

                <a href="checkout.html" class="icon-btn cart-btn" aria-label="Cart and checkout">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="17" cy="20" r="1.2"/></svg>
                    <span class="cart-btn__count" id="cartCount">0</span>
                </a>

                <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- ===== Page title ===== -->
        <section class="shop-hero">
            <div class="container">
                <h1>All products</h1>
                <p>Headphones, smartwatches, speakers and accessories, all in one place.</p>
            </div>
        </section>

        <!-- ===== Toolbar and products ===== -->
        <section class="shop-section">
            <div class="container">

                <div class="shop-toolbar">
                    <form class="search-field" id="searchForm" role="search">
                        <label for="searchInput" class="visually-hidden">Search products</label>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                        <input type="search" id="searchInput" placeholder="Search products" autocomplete="off">
                    </form>

                    <div class="sort-field">
                        <label for="sortSelect">Sort by</label>
                        <select id="sortSelect">
                            <option value="newest">Newest</option>
                            <option value="price_asc">Price: low to high</option>
                            <option value="price_desc">Price: high to low</option>
                            <option value="name">Name: A to Z</option>
                        </select>
                    </div>
                </div>

                <div class="filters" id="categoryFilters" role="group" aria-label="Filter by category">
                    <button type="button" class="filter is-active" data-category="">All</button>
                </div>

                <p class="shop__count" id="resultCount" aria-live="polite"></p>

                <div class="product-grid" id="productGrid">
                    <p class="grid-message">Loading products…</p>
                </div>

                <div class="section__footer">
                    <button type="button" class="btn btn--outline" id="loadMore" hidden>Load more products</button>
                </div>

            </div>
        </section>
    </main>

    <footer class="shop-footer">
        <div class="container shop-footer__inner">
            <p>© 2026 ShopSphere. All rights reserved.</p>
            <a href="index.html" class="link-arrow">Back to home</a>
        </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="products.js" defer></script>
</body>
</html>

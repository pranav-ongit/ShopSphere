<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - ShopSphere</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body class="auth-page">

    <main class="auth">

        <!-- Left side: picture and a line of text (hidden on phones) -->
        <section class="auth__visual" aria-hidden="true">
            <img src="images/hero-headphones.jpg" alt="">
            <div class="auth__quote">
                <p>Good sound, good style and delivery you can count on.</p>
                <small>ShopSphere</small>
            </div>
        </section>

        <!-- Right side: the forms -->
        <section class="auth__panel">

            <div class="auth__top">
                <a href="index.html" class="logo" aria-label="ShopSphere home">
                    <svg class="logo__mark" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
                        <circle cx="14" cy="14" r="12" fill="none" stroke="currentColor" stroke-width="2"/>
                        <ellipse cx="14" cy="14" rx="5" ry="12" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span class="logo__text">ShopSphere</span>
                </a>
                <a href="index.html" class="link-arrow">Back to shop</a>
            </div>

            <div class="auth__card">

                <!-- Shown only when the person is already signed in -->
                <div id="signedIn" hidden>
                    <h1 class="auth__title">You’re signed in</h1>
                    <p class="auth__sub" id="signedInText"></p>
                    <div class="auth__actions">
                        <a href="index.html" class="btn btn--primary btn--block">Continue shopping</a>
                        <button type="button" class="btn btn--outline btn--block" id="logoutBtn">Log out</button>
                    </div>
                </div>

                <!-- Sign in and Create account -->
                <div id="authForms">
                    <h1 class="auth__title" id="authTitle">Welcome back</h1>
                    <p class="auth__sub" id="authSub">Sign in to see your orders and check out faster.</p>

                    <div class="auth-tabs" role="tablist" aria-label="Account">
                        <button type="button" role="tab" id="tabLogin" data-tab="login" aria-selected="true" aria-controls="loginForm">Sign in</button>
                        <button type="button" role="tab" id="tabRegister" data-tab="register" aria-selected="false" aria-controls="registerForm">Create account</button>
                    </div>

                    <!-- Sign in form -->
                    <form id="loginForm" class="auth-form" novalidate>
                        <div class="field">
                            <label for="loginEmail">Email address</label>
                            <input type="email" id="loginEmail" name="email" autocomplete="email" placeholder="name@example.com" required>
                        </div>
                        <div class="field">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Your password" required>
                        </div>
                        <label class="show-password">
                            <input type="checkbox" data-show-password> Show password
                        </label>
                        <button type="submit" class="btn btn--primary btn--block">Sign in</button>
                        <p class="form-message" role="status" aria-live="polite"></p>
                    </form>

                    <!-- Create account form -->
                    <form id="registerForm" class="auth-form" novalidate hidden>
                        <div class="field">
                            <label for="registerName">Full name</label>
                            <input type="text" id="registerName" name="name" autocomplete="name" placeholder="Your name" required>
                        </div>
                        <div class="field">
                            <label for="registerEmail">Email address</label>
                            <input type="email" id="registerEmail" name="email" autocomplete="email" placeholder="name@example.com" required>
                        </div>
                        <div class="field">
                            <label for="registerPassword">Password</label>
                            <input type="password" id="registerPassword" name="password" autocomplete="new-password" placeholder="At least 8 characters" required>
                            <small class="field__hint">Use at least 8 characters, and avoid common passwords.</small>
                        </div>
                        <label class="show-password">
                            <input type="checkbox" data-show-password> Show password
                        </label>
                        <button type="submit" class="btn btn--primary btn--block">Create account</button>
                        <p class="form-message" role="status" aria-live="polite"></p>
                    </form>
                </div>

            </div>
        </section>
    </main>

    <script src="auth.js" defer></script>
</body>
</html>
